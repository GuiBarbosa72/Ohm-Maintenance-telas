<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro | Ohm Maintenance</title>
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body class="auth-page">
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand__omega">Ω</span>hm Maintenance</a>
  </header>

  <div class="auth-deco" aria-hidden="true">
    <span class="deco-circle deco-circle--blue pos-tl"></span>
    <span class="deco-circle deco-circle--yellow pos-bl"></span>
    <img class="deco-icon pos-tl" src="assets/img/icons/briefcase.svg" alt="" />
    <img class="deco-icon pos-br" src="assets/img/icons/pen-tool.svg" alt="" />
  </div>

  <main class="auth-main">
    <section class="auth-card">
      <h3 class="auth-card__title">Cadastro</h3>

      <form action="#" method="post">
        <div class="form-group">
          <label class="sr-only" for="email">E-mail da empresa/representante</label>
          <input class="input" type="email" id="email" name="email" placeholder="Email da empresa/rep" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="sr-only" for="telefone">Número para contato</label>
          <input class="input" type="tel" id="telefone" name="telefone" placeholder="Número para contato" required autocomplete="tel" />
        </div>

        <div class="form-group">
          <label class="sr-only" for="senha">Senha</label>
          <input class="input" type="password" id="senha" name="senha" placeholder="Senha" minlength="8" required autocomplete="new-password" />
        </div>

        <div class="form-group">
          <label class="sr-only" for="confirmar">Confirmar senha</label>
          <input class="input" type="password" id="confirmar" name="confirmar" placeholder="Confirmar senha" minlength="8" required autocomplete="new-password" />
        </div>

        <div class="auth-card__links">
          <span>Já tem uma conta? <a href="login.html">Faça login</a></span>
        </div>

        <button type="submit" class="btn">Cadastrar</button>
      </form>
    </section>
  </main>
</body>
</html>
