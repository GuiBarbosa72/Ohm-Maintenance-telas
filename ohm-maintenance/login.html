<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Ohm Maintenance</title>
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body class="auth-page">
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand__omega">Ω</span>hm Maintenance</a>
  </header>

  <div class="auth-deco" aria-hidden="true">
    <span class="deco-circle deco-circle--yellow pos-tr"></span>
    <span class="deco-circle deco-circle--yellow pos-bl"></span>
    <img class="deco-icon pos-tr" src="assets/img/icons/plug.svg" alt="" />
    <img class="deco-icon pos-bl" src="assets/img/icons/wrench.svg" alt="" />
  </div>

  <main class="auth-main">
    <section class="auth-card">
      <h3 class="auth-card__title">Login</h3>

      <form action="#" method="post">
        <div class="form-group">
          <label class="sr-only" for="email">E-mail da empresa/representante</label>
          <input class="input" type="email" id="email" name="email" placeholder="Email da empresa/rep" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="sr-only" for="senha">Senha</label>
          <input class="input" type="password" id="senha" name="senha" placeholder="Senha" required autocomplete="current-password" />
        </div>

        <div class="auth-card__links">
          <span>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></span>
          <a href="recuperar-senha.html">Esqueci minha senha</a>
        </div>

        <button type="submit" class="btn">Login</button>
      </form>
    </section>
  </main>
</body>
</html>
