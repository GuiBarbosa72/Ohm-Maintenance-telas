<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperação de senha | Ohm Maintenance</title>
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body class="auth-page">
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand__omega">Ω</span>hm Maintenance</a>
  </header>

  <div class="auth-deco" aria-hidden="true">
    <span class="deco-circle deco-circle--yellow pos-tr"></span>
    <span class="deco-circle deco-circle--blue pos-bl"></span>
  </div>

  <main class="auth-main">
    <section class="auth-card">
      <h3 class="auth-card__title">Recuperar/trocar senha</h3>

      <form action="#" method="post">
        <div class="form-group">
          <label class="sr-only" for="email">E-mail de confirmação</label>
          <input class="input" type="email" id="email" name="email" placeholder="Email de confirmação" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="sr-only" for="senha">Nova senha</label>
          <input class="input" type="password" id="senha" name="senha" placeholder="Digite a nova senha" minlength="8" required autocomplete="new-password" />
        </div>

        <div class="auth-card__links">
          <a href="login.html">Voltar para o login</a>
        </div>

        <button type="submit" class="btn">Enviar</button>
      </form>
    </section>
  </main>
</body>
</html>
